name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow automatically when you push a tag starting with 'v' (e.g., 'v1.1.1')

permissions:
  contents: write # Needed to give the action permission to create releases and upload files

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up consecutive builds

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Executable
        run: pyinstaller BatchEditor.spec

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe # Uploads the .exe generated by PyInstaller
          generate_release_notes: true
